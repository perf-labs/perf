name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: pip install -e .[test]

      - name: pytest
        run: python -m pytest --cov -q

      - name: coverage
        run: |
          python -m coverage report
          python -m coverage json --fail-under=80

      - name: filecheck
        run: |
          if ! command -v FileCheck; then
            for v in 20 19 18 17 16 15 14; do
              if command -v FileCheck-$v; then
                sudo ln -s "$(command -v FileCheck-$v)" /usr/local/bin/FileCheck
                break
              fi
            done
          fi
          command -v FileCheck || { sudo apt-get update && sudo apt-get install -y llvm; }
          FileCheck --version

      - name: lit
        # -j2 bounds parallel angr explorations; 13MB+ binaries OOM small runners otherwise.
        run: lit -v -j2 --timeout 600 tests/x86_64

      - name: ruff check
        run: ruff check src tests bin

      - name: ruff format
        run: ruff format --check src tests bin

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: install
        run: pip install -e .[test]

      - name: install kernel
        run: python -m ipykernel install --user --name python3

      - name: check hardware counters
        id: pmu
        run: |
          if python -c "from perf.core import resolve; resolve('cycles'); resolve('topdown-retiring')" 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hardware counters unavailable, notebooks will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: papermill
        if: steps.pmu.outputs.available == 'true'
        run: |
          set -euo pipefail
          shopt -s globstar
          mkdir -p /tmp/perf-notebooks
          failed=0
          for notebook in studies/**/*.ipynb; do
            [ -f "$notebook" ] || continue
            name="${notebook#studies/}"
            name="${name//\//-}"
            name="${name%.ipynb}"
            if ! papermill "$notebook" "/tmp/perf-notebooks/${name}.ipynb"; then
              echo "FAILED: $notebook"
              failed=1
            fi
          done
          exit "$failed"
