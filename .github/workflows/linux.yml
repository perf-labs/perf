name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install -e .[test]

      - name: ruff version
        run: ruff --version

      - name: pytest
        run: python -m pytest -v

      - name: ruff check
        run: ruff check src tests bin

      - name: ruff format
        run: ruff format --check src tests bin

      - name: install kernel
        run: python -m ipykernel install --user --name python3

      - name: papermill
        run: |
          set -euo pipefail
          shopt -s globstar
          jupyter kernelspec list
          mkdir -p /tmp/perf-notebooks

          for notebook in studies/**/*.ipynb; do
            [ -f "$notebook" ] || continue
            name="${notebook#studies/}"
            name="${name//\//-}"
            name="${name%.ipynb}"
            papermill "$notebook" "/tmp/perf-notebooks/${name}.ipynb" || echo "FAILED: $notebook"
          done
