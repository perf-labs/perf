[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-labs"
version = "0.0.1"
description = "profile -> benchmark -> analyze -> optimize"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kris Jusiak", email = "kris@jusiak.net" }]
maintainers = [{ name = "Kris Jusiak", email = "kris@jusiak.net" }]
keywords = ["profile", "benchmark", "analyze", "optimize"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Benchmark",
  "Topic :: System :: Hardware",
]
dependencies = [
    "angr>=9.2.213",
    "bitstring<5", # pyvex
    "capstone>=5.0.6",
    "claripy>=9.2.213",
    "osaca>=0.7.1",
    "cxxfilt>=0.3.0",
    "ipython>=9.17.1",
    "keystone-engine>=0.9.2",
    "matplotlib>=3.11.2",
    "matplotlib-backend-sixel>=0.1.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "py-cpuinfo>=9.0.0",
    "pyelftools>=0.33",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/perf-labs/perf"
Repository = "https://github.com/perf-labs/perf.git"
Issues = "https://github.com/perf-labs/perf/issues"
Documentation = "https://github.com/perf-labs/perf/blob/main/README.md"

[project.optional-dependencies]
test = [
    "ipykernel>=7.4.0",
    "lit>=16",
    "papermill>=2.7.0",
    "psutil>=7",
    "pytest>=9.1.1",
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["perf", "perf.arch"]
script-files = [
    "bin/perf-system",
    "bin/perf-profile",
    "bin/perf-benchmark",
    "bin/perf-analyze",
    "bin/perf-compare",
    "bin/perf-view",
    "bin/perf-plot",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/x86_64/lit.cfg" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["perf"]

[tool.ruff.format]
exclude = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*vert.*:matplotlib.MatplotlibDeprecationWarning",
]
