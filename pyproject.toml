[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-labs"
version = "0.0.1"
description = "profile -> benchmark -> analyze -> optimize"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kris Jusiak", email = "kris@jusiak.net" }]
keywords = ["profile", "benchmark", "analyze", "optimize"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "angr",
    "capstone",
    "claripy",
    "osaca",
    "cxxfilt",
    "ipython",
    "keystone-engine",
    "matplotlib",
    "matplotlib-backend-sixel",
    "numpy",
    "pandas",
    "py-cpuinfo",
    "pyelftools",
    "seaborn",
]

[project.optional-dependencies]
test = [
    "ipykernel",
    "papermill",
    "pytest",
    "ruff>=0.15,<0.16",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["perf", "perf.arch"]
script-files = [
    "bin/perf-info",
    "bin/perf-profile",
    "bin/perf-benchmark",
    "bin/perf-analyze",
    "bin/perf-compare",
    "bin/perf-view",
    "bin/perf-plot",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["perf"]

[tool.ruff.format]
exclude = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*were <= overhead.*:RuntimeWarning",
    "ignore:.*vert.*:matplotlib.MatplotlibDeprecationWarning",
]
