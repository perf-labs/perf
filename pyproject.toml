[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "perf-labs"
version = "0.0.1"
description = "profile -> benchmark -> analyze -> optimize"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kris Jusiak", email = "kris@jusiak.net" }]
maintainers = [{ name = "Kris Jusiak", email = "kris@jusiak.net" }]
keywords = ["profile", "benchmark", "analyze", "optimize"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Benchmark",
  "Topic :: System :: Hardware",
]
dependencies = [
    "angr>=9.2.213,<10",
    "bitstring>=4.4.0,<5", # pyvex
    "capstone>=5.0.6,<6",
    "claripy>=9.2.213,<10",
    "pycparser>=3.0,<3.12", # angr
    "osaca>=0.7.1,<0.8",
    "cxxfilt>=0.3.0,<0.4",
    "ipython>=9.17.1,<10",
    "keystone-engine>=0.9.2,<0.10",
    "matplotlib>=3.11.2,<3.12",
    "matplotlib-backend-sixel>=0.1.0,<0.2",
    "numpy>=2.4.6,<3",
    "pandas>=3.0.6,<4",
    "py-cpuinfo>=9.0.0,<10",
    "pyelftools>=0.33,<0.34",
    "seaborn>=0.13.2,<0.14",
]

[project.urls]
Homepage = "https://github.com/perf-labs/perf"
Repository = "https://github.com/perf-labs/perf.git"
Issues = "https://github.com/perf-labs/perf/issues"
Documentation = "https://github.com/perf-labs/perf/blob/main/README.md"

[project.optional-dependencies]
test = [
    "ipykernel>=7.4.0,<8",
    "lit>=16,<17",
    "papermill>=2.7.0,<3",
    "psutil>=7.2.2,<8",
    "pytest>=9.1.1,<10",
    "ruff>=0.17,<0.18",
]

[tool.setuptools]
package-dir = { "" = "src" }
script-files = [
    "bin/perf-system",
    "bin/perf-profile",
    "bin/perf-benchmark",
    "bin/perf-analyze",
    "bin/perf-compare",
    "bin/perf-view",
    "bin/perf-plot",
    "bin/perf-optimize",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["perf*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/x86_64/lit.cfg" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["perf"]

[tool.ruff.format]
exclude = []

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*vert.*:matplotlib.MatplotlibDeprecationWarning",
    "ignore::DeprecationWarning:osaca.*",
    "ignore::DeprecationWarning:pyparsing.*",
    'ignore:all .* run\(s\) for event .* were < overhead .*:RuntimeWarning',
]
