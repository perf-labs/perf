import glob
import os
import platform
import shutil
import sys
import sysconfig

import lit.formats

config.name = "perf-x86_64"
config.test_format = lit.formats.ShTest()
config.suffixes = [".test"]
config.excludes = ["Output"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(config.test_source_root, "Output")

features = []
if platform.machine().lower() in ("x86_64", "amd64"):
    features.append("x86_64")
for _tool in ("gcc", "g++", "clang", "rustc", "zig", "ar"):
    if shutil.which(_tool):
        features.append(_tool)
_tree = shutil.which("tree")
if _tree:
    features.append("tree")
    config.substitutions.append(("%tree", _tree))
_libdir = sysconfig.get_config_var("LIBDIR")
_libc_candidates = [os.path.join(_libdir, "libc.so.6")] if _libdir else []
_libc_candidates += [
    *glob.glob("/lib/*/libc.so.6"),
    *glob.glob("/usr/lib/*/libc.so.6"),
    *glob.glob("/lib64/libc.so.6"),
    *glob.glob("/lib/libc.so.6"),
]
_machine = platform.machine().lower()
_libc = next(
    (
        path
        for path in _libc_candidates
        if os.path.exists(path)
        and (
            _machine in path.lower()
            or _machine.replace("_", "-") in path.lower()
            or os.path.dirname(path) in ("/lib64", "/lib")
        )
    ),
    None,
)
if _libc:
    features.append("system-libc")
    config.substitutions.append(("%libc", _libc))
try:
    sys.path.insert(0, os.path.join(os.path.dirname(__file__), "..", "..", "src"))
    from perf import core as _core

    _ev = _core.open_event("cycles")
    try:
        _ev.enable()
        _ev.rdpmc_index
    finally:
        _ev.close()
    features.append("pmu")
except Exception:
    pass
config.available_features.update(features)

_filecheck = shutil.which("FileCheck")
if _filecheck:
    config.substitutions.append(("%FileCheck", _filecheck))
else:
    lit_config.fatal(
        "FileCheck not found on PATH. Install LLVM FileCheck "
        "(e.g. apt install llvm) so lit can match test output."
    )

_llvm_mca = shutil.which("llvm-mca")
if _llvm_mca:
    config.substitutions.append(("%llvm-mca", _llvm_mca))
    config.available_features.add("llvm-mca")
