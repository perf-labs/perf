import os
import platform
import shutil
import sys

import lit.formats

config.name = "perf-x86_64"
config.test_format = lit.formats.ShTest()
config.suffixes = [".test"]
config.excludes = ["Output"]
config.test_source_root = os.path.dirname(__file__)
config.test_exec_root = os.path.join(config.test_source_root, "Output")

features = []
if platform.machine().lower() in ("x86_64", "amd64"):
    features.append("x86_64")
for _tool in ("gcc", "g++", "clang", "rustc", "zig"):
    if shutil.which(_tool):
        features.append(_tool)
if os.path.exists("/usr/bin/tree"):
    features.append("tree")
if os.path.exists("/lib/x86_64-linux-gnu/libc.so.6"):
    features.append("system-libc")
try:
    sys.path.insert(0, os.path.join(os.path.dirname(__file__), "..", "..", "src"))
    from perf import core as _core

    _ev = _core.open_event("cycles")
    _ev.close()
    features.append("pmu")
except Exception:
    pass
config.available_features.update(features)

for _cand in (
    "FileCheck",
    "FileCheck-20",
    "FileCheck-19",
    "FileCheck-18",
    "FileCheck-17",
    "FileCheck-16",
    "FileCheck-15",
):
    _path = shutil.which(_cand)
    if _path:
        config.substitutions.append(("%FileCheck", _path))
        break
else:
    lit_config.fatal(
        "FileCheck not found on PATH. Install LLVM FileCheck "
        "(e.g. apt install llvm) so lit can match test output."
    )
